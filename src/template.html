<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japanese N5–N4 Course</title>
<meta name="description" content="A complete beginner Japanese course covering JLPT N5 and N4 grammar, vocabulary, counters, keigo and exercises with answers.">
<style>
:root{
  --paper:#fbf8f2; --card:#ffffff; --ink:#1f2328; --muted:#5d6470; --line:#e6e0d4;
  --soft:#f1ebdf; --soft2:#e3dccd; --acc:#c4432f; --acc2:#2e4a7a; --accbg:#fbe9e5; --acc2bg:#e7edf7;
  --ok:#2f7a4f; --okbg:#e5f3ea; --warnbg:#fff4dc; --warn:#9a6400;
  --skin:#f3cfae; --gold:#e9b23c; --leaf:#5a9a68; --sky:#d9e9f6; --pink:#f3a9bb; --white:#ffffff; --black:#1f2328; --mount:#2e4a7a;
  --jp:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP","Noto Serif CJK JP",serif;
  --jps:"Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,var(--jps);
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#16181c; --card:#1e2127; --ink:#e9e6df; --muted:#a3a9b3; --line:#30343c;
    --soft:#262a31; --soft2:#343943; --acc:#ef6a54; --acc2:#7fa2e0; --accbg:#3a2420; --acc2bg:#1f2a3d;
    --ok:#6fcf97; --okbg:#1d3127; --warnbg:#3a2f17; --warn:#f0c060; color-scheme:dark; --skin:#e2b892; --gold:#d9a233; --leaf:#4f8a5d; --sky:#26364a; --pink:#d98aa0; --white:#e9edf3; --black:#0c0d10; --mount:#46639c;
  }
}
:root[data-theme="dark"]{
  --paper:#16181c; --card:#1e2127; --ink:#e9e6df; --muted:#a3a9b3; --line:#30343c;
  --soft:#262a31; --soft2:#343943; --acc:#ef6a54; --acc2:#7fa2e0; --accbg:#3a2420; --acc2bg:#1f2a3d;
  --ok:#6fcf97; --okbg:#1d3127; --warnbg:#3a2f17; --warn:#f0c060; color-scheme:dark; --skin:#e2b892; --gold:#d9a233; --leaf:#4f8a5d; --sky:#26364a; --pink:#d98aa0; --white:#e9edf3; --black:#0c0d10; --mount:#46639c;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:70px}
body{margin:0;background:var(--paper);color:var(--ink);font:16.5px/1.65 var(--ui);-webkit-text-size-adjust:100%}
[lang="ja"],.j,.jp{font-family:var(--jps)}
a{color:var(--acc2)}
/* svg classes */
svg .t{fill:var(--ink);font-family:var(--ui)} svg .tj{fill:var(--ink);font-family:var(--jps)} svg .b{font-weight:700}
svg .f-skin{fill:var(--skin)} svg .s-skin{stroke:var(--skin)} svg .f-gold{fill:var(--gold)} svg .f-leaf{fill:var(--leaf)} svg .f-sky{fill:var(--sky)} svg .f-pink{fill:var(--pink)} svg .f-shadow{fill:var(--ink);opacity:.12} svg .f-acc2bg{fill:var(--acc2bg)} svg .f-accbg{fill:var(--accbg)} svg .s-soft2{stroke:var(--soft2)}
svg .f-white{fill:var(--white)} .s-white{stroke:var(--white)} svg .f-black{fill:var(--black)} .s-black{stroke:var(--black)} svg .f-mount{fill:var(--mount)}
svg .f-ink{fill:var(--ink)} svg .f-acc{fill:var(--acc)} svg .f-acc2{fill:var(--acc2)} svg .f-soft{fill:var(--soft)} svg .f-soft2{fill:var(--soft2)} svg .f-paper{fill:var(--card)}
.s-ink{stroke:var(--ink)} .s-acc{stroke:var(--acc)} .s-acc2{stroke:var(--acc2)} .s-soft{stroke:var(--muted)} .s-paper{stroke:var(--card)}

/* rtl */
.short{display:none}
.j,.jp,.kch,.kro,.ro,code{unicode-bidi:isolate}
[dir="rtl"] .rule,[dir="rtl"] .kgrid,[dir="rtl"] .ctr ol,[dir="rtl"] .ex .jp,[dir="rtl"] .ex .ro,[dir="rtl"] td.ro,[dir="rtl"] td[lang="ja"],[dir="rtl"] .fig svg{direction:ltr}
[dir="rtl"] .ex .jp,[dir="rtl"] .ex .ro{text-align:left}
[dir="rtl"] svg{direction:ltr}
[dir="rtl"] .ex .en,[dir="rtl"] .fig figcaption{font-style:normal}
[dir="rtl"] td.ro,[dir="rtl"] td[lang="ja"]{text-align:right}
[dir="rtl"] body{font-family:"Segoe UI","Noto Naskh Arabic","Geeza Pro",Tahoma,var(--ui)}
[dir="rtl"] .ans ol{padding:0 40px 12px 18px}
[dir="rtl"] .toc .tp>a,[dir="rtl"] .lnum,[dir="rtl"] .plabel,[dir="rtl"] th,[dir="rtl"] .call .cl{letter-spacing:0}
/* top bar */
.bar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1240px;margin:0 auto;padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:nowrap;position:relative}
.brand{font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:8px}
.navg{display:flex;gap:4px;margin-inline-start:14px;background:var(--soft);border-radius:999px;padding:3px}.navg .tg{border-color:transparent;background:transparent;padding:5px 14px}.navg .tg:hover{background:var(--card)}
.grow{flex:1}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:16px;z-index:30;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:14px;display:flex;flex-direction:column;gap:12px;min-width:290px;max-width:calc(100vw - 24px)}.menu[hidden]{display:none}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted)}.mrow[hidden]{display:none}.mrow>span:first-child{display:flex;flex-direction:column;min-width:0}.mhint{font-size:11.5px;opacity:.85;max-width:170px}.mctl{display:flex;gap:6px;align-items:center}.menu .sel{max-width:150px}.menu #rate{display:inline-block;max-width:110px}.menu #t-cloud{font-size:13px;padding:5px 12px}
.brand .dot{width:14px;height:14px;border-radius:50%;background:var(--acc)}
.tg{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px;font:600 13px var(--ui);cursor:pointer;white-space:nowrap}
.tg[aria-pressed="true"]{background:var(--acc2);border-color:var(--acc2);color:#fff}
.audio[hidden]{display:none}
.sel{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 8px;font:600 13px var(--ui);max-width:190px}
.keybox{max-width:1240px;margin:0 auto;padding:4px 16px 12px}.keybox[hidden]{display:none}
.keybox .keyform{max-width:560px;margin-inline-start:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.keybox label{font:700 13px var(--ui);display:block;margin-bottom:6px}
.keyrow{display:flex;gap:8px}.keyrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:7px 10px;font:14px ui-monospace,Menlo,Consolas,monospace}
#savebox hr{border:0;border-top:1px solid var(--line);margin:12px 0 10px}#savemsg{margin:6px 0 8px;font-size:13px;color:var(--muted)}
#keymsg{margin:8px 0 0;font-size:13px;color:var(--muted)}
.tg:focus-visible,.kc:focus-visible,.mini:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:0 16px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:40px}
.side{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding:24px 4px 40px 0}
main{min-width:0;padding-bottom:80px}
.toc ol{list-style:none;margin:0;padding:0}
.toc .tp>a{display:block;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);text-decoration:none;margin:18px 0 6px}
.toc li li a{display:block;padding:4px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14px;line-height:1.35}
.toc li li a span{color:var(--muted);font-size:12px;display:block}
.toc li li a:hover{background:var(--soft)}
.toc li li a.on{background:var(--acc2bg);color:var(--acc2)}
.mtoc{display:none}

/* hero */
.hero{padding:36px 0 10px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
.hero h1{font-size:clamp(30px,4.4vw,46px);line-height:1.1;margin:0 0 12px;letter-spacing:-.01em}
.hero p{color:var(--muted);margin:0 0 10px;max-width:56ch}
.hero svg{width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.legend span{font-size:13px;background:var(--soft);border-radius:999px;padding:3px 10px}

/* parts & lessons */
.part{margin:56px 0 8px;padding:28px;border-radius:var(--r);background:var(--acc2);color:#fff}
.part h1{margin:4px 0 0;font-size:clamp(24px,3.4vw,34px);line-height:1.2}
.plabel{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:13px;opacity:.85}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(16px,3vw,36px) 30px;margin:26px 0}
.lhead{display:flex;flex-direction:column;gap:2px;border-bottom:2px solid var(--line);padding-bottom:14px;margin-bottom:8px}
.lnum{color:var(--acc);font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.lesson h2{margin:0;font-size:clamp(22px,3vw,30px);line-height:1.25}
h3{display:flex;align-items:center;gap:10px;font-size:21px;margin:34px 0 8px;line-height:1.3}
h3 .cn{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-size:14px}
h4{font-size:17px;margin:24px 0 6px;color:var(--acc2)}
p{margin:8px 0}
.j{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .15s}
.j:hover{background:var(--accbg)}
.pts{margin:8px 0;padding-inline-start:22px}.pts li{margin:4px 0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);padding:1px 5px;border-radius:5px;font-size:.92em}

/* examples */
.exs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:14px 0}
.ex{background:var(--soft);border-inline-start:4px solid var(--acc);border-radius:10px;padding:12px 16px}
.ex p{margin:0}
.ex .jp{font-size:20px;line-height:1.5;cursor:pointer}
ruby{ruby-position:over}rt{font-size:.5em;color:var(--muted);font-weight:400;user-select:none;-webkit-user-select:none}body:not(.nofuri) .ex .jp:has(ruby),body:not(.nofuri) .ll-jp:has(ruby){line-height:2.1}body.nofuri rt{display:none}
@media (hover:none){.ex .jp::after{content:none}}
.ex .jp::after{content:" 🔊";font-size:12px;opacity:0;transition:opacity .15s}
.ex:hover .jp::after{opacity:.6}
.ex .ro{color:var(--acc2);font-size:14.5px;margin-top:2px}
.ex .en{color:var(--muted);font-style:italic;margin-top:4px}
body.no-ro .ro{visibility:hidden}
body.no-ro .ex .ro{display:none}
body.no-en .ex .en{filter:blur(6px);cursor:pointer;user-select:none}
body.no-en .ex .en.show{filter:none}

/* rules */
.rule{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:12px 0;padding:10px 12px;border:1.5px dashed var(--acc2);border-radius:10px;background:var(--acc2bg)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-weight:600}
.plus{color:var(--acc2);font-weight:800}

/* callouts */
.call{display:flex;gap:12px;align-items:flex-start;border-radius:10px;padding:10px 14px;margin:14px 0;background:var(--acc2bg)}
.call .cl{flex:none;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--acc2);color:#fff;margin-top:3px}
.call.warn{background:var(--accbg)}.call.warn .cl{background:var(--acc)}
.call.tip{background:var(--okbg)}.call.tip .cl{background:var(--ok);color:var(--card)}
.call.fix{background:var(--warnbg)}.call.fix .cl{background:var(--warn);color:var(--card)}
.call div{min-width:0}

.hero svg{border-radius:var(--r)}
/* figures */
.fig{margin:18px 0;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.fig svg{display:block;width:100%;height:auto;max-height:330px}
.fig figcaption{color:var(--muted);font-size:14px;text-align:center;margin-top:6px}

/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--soft)}
.vocab,.gtable{margin:18px 0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.tcap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;font-weight:700;background:var(--soft);border-bottom:1px solid var(--line)}
.vt td.kj{font-size:18px;white-space:nowrap}
.vt td[lang="ja"]{white-space:nowrap}
.vt td.ro{color:var(--acc2)}
.vocab.quiz .mean span{filter:blur(6px);cursor:pointer;user-select:none}
.vocab.quiz .mean.show span{filter:none}
.tbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
td.ac,th.ac{width:40px;padding-inline:4px;text-align:center}
td.ac,th.ac{position:sticky;inset-inline-end:0;background:var(--card)}th.ac{background:var(--soft)}
.dk-btns .tg{text-transform:capitalize}
.addc{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--acc2);font:700 16px var(--ui);cursor:pointer;line-height:1}
.addc.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.badge{display:inline-block;min-width:18px;margin-inline-start:6px;padding:0 5px;border-radius:9px;background:var(--line);color:var(--ink);font-size:11px;line-height:18px;text-align:center}
.ov{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;-webkit-overflow-scrolling:touch}.ov[hidden]{display:none}
body.ov-open{overflow:hidden}
.ov-in{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.wsheet{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 24px));background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 34px rgba(0,0,0,.22);padding:14px;display:flex;flex-direction:column;gap:10px}
.wsheet[hidden]{display:none}
.ws-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ws-jp{border:0;background:none;color:var(--ink);font:600 26px/1.3 var(--jps);text-align:start;padding:0;cursor:pointer;overflow-wrap:anywhere}.ws-jp.sent{font-size:18px;font-weight:500}
.ws-r{color:var(--muted);font-size:15px}.ws-m{font-size:16px}
.ws-act{display:flex;gap:8px;align-items:center}.ws-act .sel{flex:1;min-width:0;max-width:none}
.ws-add{background:var(--acc2);border-color:var(--acc2);color:#fff;white-space:nowrap}.ws-add.on{background:var(--ok);border-color:var(--ok);color:var(--card)}
.wsheet input{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;padding:8px 10px;font:15px var(--ui)}
.toast{bottom:calc(150px + env(safe-area-inset-bottom,0px))!important}
.lz{margin:14px 0 0;display:flex;justify-content:center}
a.ldone::after{content:" ✓";color:var(--ok);font-weight:700}
.kj-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.kj-nb{margin:0;font-size:15px}.kj-seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden}.kj-seg button{border:0;background:var(--card);color:var(--ink);padding:10px 6px;font:600 14.5px var(--ui);cursor:pointer}.kj-seg button.on{background:var(--acc2);color:#fff}
.nb{margin:28px 0 0;border:1px dashed var(--line);border-radius:var(--r);padding:12px 16px;background:var(--card)}.nb ul{margin:6px 0 0;padding-inline-start:20px}.nb li{margin:4px 0}
.nbks{display:inline-flex;gap:4px;flex-wrap:wrap;vertical-align:middle}.nbk{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:8px;font:500 19px/1 var(--jps);padding:5px 7px}
.ico{display:block}.dk-card .ico{width:112px;height:112px}.wsheet .ico{position:absolute;top:12px;inset-inline-end:14px;width:56px;height:56px}.wsheet:has(.ico) .ws-main{padding-inline-end:64px}
.dk-pre{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.dk-pre summary{cursor:pointer;font-weight:700;padding:8px 0}
.dk-plist{list-style:none;margin:0;padding:0}.dk-plist li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.dk-pn{display:flex;flex-direction:column;min-width:0;font-size:14.5px}.dk-pn span{color:var(--muted);font-size:13px}
.mini.on{background:var(--ok);border-color:var(--ok);color:var(--card)}.mini:disabled{cursor:default}
.dk-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.dk-title{font-size:24px}.dk-count{color:var(--muted);font-size:14px}
.dk-hint{margin:0;color:var(--muted);font-size:13.5px}
.dk-deck{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.dk-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dk-name{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink);font:700 17px var(--ui);cursor:pointer;padding:0;text-align:start}
.dk-radio{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}.dk-deck.cur .dk-radio{border-color:var(--acc2);background:radial-gradient(var(--acc2) 45%,transparent 50%)}
.dk-meta{color:var(--muted);font-size:13.5px}.dk-meta b{color:var(--acc)}
.dk-btns,.dk-new,.dk-io,.dk-form{display:flex;gap:8px;flex-wrap:wrap}
.tg:disabled{opacity:.45;cursor:default}

.dk-ren{font-weight:700}

.dk-lj{font-size:17px}.dk-lm{color:var(--muted);min-width:0;overflow-wrap:anywhere}.dk-ld{color:var(--muted);font-size:12px;white-space:nowrap}.dk-empty{display:block!important;color:var(--muted)}
.dk-prog{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft2);gap:2px}.dk-prog i{display:block}.dk-prog .k,.dk-leg .k,.dot.k{background:var(--ok)}.dk-prog .l,.dk-leg .l,.dot.l{background:var(--acc2)}.dk-prog .n,.dk-leg .n,.dot.n{background:var(--soft2)}
.dk-leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.dk-leg span{text-transform:capitalize}.dk-leg i,.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px}.dk-leg .n,.dot.n{box-shadow:inset 0 0 0 1px var(--muted)}
.dk-own{display:flex;flex-direction:column;gap:8px;font-size:14px}
.dk-opts{display:flex;gap:16px;flex-wrap:wrap;font-size:14.5px}.dk-imp{display:inline-flex;align-items:center}
.dk-card{background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:260px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.dk-card hr{width:60%;border:0;border-top:1px solid var(--line);margin:6px 0}
.dk-jp{border:0;background:none;color:var(--ink);font:500 clamp(34px,9vw,54px)/1.25 var(--jps);cursor:pointer;overflow-wrap:anywhere}
.dk-r{margin:0;font-size:22px}.dk-ro{margin:0;color:var(--acc2)}.dk-m{margin:0;font-size:20px;font-weight:600}.dk-done{font-size:19px;margin:0}
.dk-show{border:0;border-radius:14px;background:var(--acc2);color:#fff;font:700 17px var(--ui);padding:16px;cursor:pointer}
.dk-grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

/* counters */
.counters{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:16px 0}

.ans ol{margin:0;padding:0 18px 12px 40px}
.ans li{margin:4px 0}
body.show-ans .ans{}
footer{color:var(--muted);font-size:14px;text-align:center;padding:30px 0}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}

    document.querySelectorAll('#content .ex').forEach(function(e){var j=e.querySelector('.jp'), en=e.querySelector('.en'), ro=e.querySelector('.ro'); if(!j) return; var jt=j.getAttribute('data-say')||j.textContent.trim(), et=en?en.textContent.trim():'';
      o.push({k:'x',t:'',s:et,m:jt,f:[norm(jt),norm(ro?ro.textContent:''),norm(et)],el:e});});
    sIdx=o;
  }
  function sScore(e,q){
    var best=9; for(var i=0;i<e.f.length;i++){var f=e.f[i]; if(!f) continue; var p=f.indexOf(q); if(p<0) continue;
      var sc=f===q?0:p===0?1:(f.charAt(p-1)===' '?2:3); if(e.k==='x') sc+=1; if(sc<best) best=sc;} return best;
  }
  function hlt(t,q){var n=esc(t); if(!q) return n; try{var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return n.replace(re,'<mark>$1</mark>');}catch(e){return n;}}
  function sRun(){
    if(!sIdx) sBuild(); var raw=sQ.value.trim(), q=norm(raw), h=''; sHits=[];
    if(!q){sR.innerHTML='<p class="sr-none">'+esc(T('sph'))+'</p><button type="button" class="tg gibtn">'+esc(T('gindex'))+' ›</button>'; return;}
    var groups={v:[],g:[],h:[],x:[]};
    sIdx.forEach(function(e){var sc=sScore(e,q); if(sc<9) groups[e.k].push([sc,e]);});
    var gram=groups.h.concat(groups.g);
    [['v','s_v',groups.v,10],['g','s_g',gram,10],['x','s_x',groups.x,6]].forEach(function(G){
      var list=G[2].sort(function(a,b){return (a[1].k==='h'?0:1)-(b[1].k==='h'?0:1)||a[0]-b[0]||(a[1].m||'').length-(b[1].m||'').length}); if(G[0]==='g'){var hs=list.filter(function(x){return x[1].k==='h'}), gs=list.filter(function(x){return x[1].k!=='h'}); list=hs.slice(0,5).concat(gs,hs.slice(5));} if(!list.length) return;
      h+='<div class="sr-g"><h3><span>'+esc(T(G[1]))+'</span><span>'+list.length+'</span></h3>';
      list.slice(0,G[3]).forEach(function(x){var e=x[1], n=sHits.push(e)-1;
        h+='<button type="button" class="sr '+e.k+'" data-n="'+n+'">'+(e.t?'<span class="sj" lang="ja">'+hlt(e.t,raw)+'</span>':'')+'<span class="sm" dir="auto"'+(e.k==='x'?' lang="ja"':'')+'>'+hlt(e.m,raw)+'</span><span class="ss" dir="auto">'+hlt(e.s,raw)+(e.k==='v'&&e.el&&lesShort(e.el)?' — '+esc(lesShort(e.el)):'')+'</span></button>';});
      h+='</div>';});
    sR.innerHTML=h||'<p class="sr-none">'+esc(T('s_none'))+'</p>';
  }
  function jumpTo(el){
    var sec=el.closest('section.lesson'); if(!sec) return; closeAll(); setLes(sec.id); applyPage(); navSync();
    var d=el.closest('details'); if(d) d.open=true;
    setTimeout(function(){el.scrollIntoView({block:'center'}); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');},30);
  }
  function openSearch(){closeAll(); sP.hidden=false; b.classList.add('ov-open'); sQ.setAttribute('placeholder',T('sph')); sRun(); navSync(); setTimeout(function(){sQ.focus(); sQ.select();},30);}
  document.getElementById('t-search').addEventListener('click',openSearch);
  document.getElementById('sclose').addEventListener('click',function(){closeAll(); navSync();});
  sQ.addEventListener('input',sRun);
  sR.addEventListener('click',function(e){
    var t=e.target.closest('.sr'); if(!t) return; var x=sHits[+t.getAttribute('data-n')]; if(!x) return;
    if(x.we){wLv=x.wl; openWords(x.we[0]); return;}
    if(x.k==='g'){var el=null, js=document.querySelectorAll('#content .j'); for(var i=0;i<js.length;i++){if(js[i].textContent.trim().replace(/^[〜～]/,'')===x.w){el=js[i];break;}} if(el) jumpTo(el); return;}
    jumpTo(x.el);
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!e.metaKey&&!e.ctrlKey){e.preventDefault(); openSearch();}
    else if(e.key==='Escape'&&!sP.hidden){closeAll(); navSync();}
  });
  // ---- grammar index: every pattern heading, grouped by lesson ----
  var gP=document.getElementById('grampanel'), gB=document.getElementById('grambody'), gHits=[];
  function gramList(){
    var out=[];
    document.querySelectorAll('#content section.lesson').forEach(function(sec){var items=[];
      sec.querySelectorAll('h3, h4').forEach(function(hd){var t=[].map.call(hd.childNodes,function(n){return n.textContent}).join(' ').replace(/\s+/g,' ').trim().replace(/^\d+\.?\s*/,''), i=t.indexOf(' — ');
        if(i<1) return; var pat=t.slice(0,i).trim(), m=t.slice(i+3).trim(); if(!/[぀-ヿ一-鿿]/.test(pat)) return; items.push({p:pat,m:m,el:hd});});
      if(items.length) out.push({id:sec.id,items:items});});
    return out;
  }
  function gRender(){
    var L=gramList(), n=0, h='<div class="dk-top"><b class="dk-title">'+esc(T('gindex'))+'</b><button class="tg" data-a="close">✕</button></div>'; gHits=[];
    L.forEach(function(g){n+=g.items.length; h+='<div class="sr-g"><h3><span>'+esc(lesTitle(g.id))+'</span>'+(kDone(g.id)?'<span>✓</span>':'')+'</h3>';
      g.items.forEach(function(x){var k=gHits.push(x.el)-1; h+='<button type="button" class="sr gi" data-n="'+k+'"><span class="sj" lang="ja">'+esc(x.p)+'</span><span class="sm" dir="auto">'+esc(x.m)+'</span></button>';});
      h+='</div>';});
    gB.innerHTML=h.replace('</b><button','</b><span class="dk-count">'+n+'</span><button');
  }
  function openGram(){closeAll(); gRender(); gP.hidden=false; b.classList.add('ov-open'); navSync();}
  gP.addEventListener('click',function(e){
    if(e.target.closest('[data-a="close"]')){closeAll(); navSync(); return;}
    var t=e.target.closest('.sr'); if(t&&gHits[+t.getAttribute('data-n')]) jumpTo(gHits[+t.getAttribute('data-n')]);
  });
  document.addEventListener('click',function(e){if(e.target.closest('.gibtn')){e.preventDefault(); openGram();}});
  // ---- words: the full JLPT N5 and N4 lists ----
  var wP=document.getElementById('wordpanel'), wB=document.getElementById('wordbody'), wLv='n5', wQ='', wRows=[];
  function wList(){
    var q=norm(wQ), d=curDeck(), h='', n=0; wRows=[];
    WD[wLv].forEach(function(e){
      if(q&&norm(e[0]).indexOf(q)<0&&norm(e[1]).indexOf(q)<0&&norm(wMean(e)).indexOf(q)<0) return;
      var r=wRef(e), i=wRows.push({e:e,r:r})-1, on=hasRef(d,r); n++;
      h+='<div class="wr"><button class="wj" lang="ja" data-a="say" data-n="'+i+'">'+esc(e[0])+'</button><span class="wk" lang="ja">'+(e[1]!==e[0]?esc(e[1]):'')+'</span><span class="wm" dir="auto">'+esc(wMean(e))+'</span><button class="mini'+(on?' on':'')+'" data-a="add" data-n="'+i+'">'+(on?'✓':'＋')+'</button></div>';});
    document.getElementById('w-list').innerHTML=h||'<p class="sr-none">'+esc(T('s_none'))+'</p>';
    document.getElementById('w-n').textContent=n+' / '+WD[wLv].length;
  }
  function wordsRender(){
    var d=curDeck(), has=DK.list.some(function(x){return x.p==='W:'+wLv});
    var h='<div class="dk-top"><b class="dk-title">'+esc(T('words'))+'</b><button class="tg" data-a="close">✕</button></div>';
    h+='<div class="kj-seg"><button data-a="lv" data-v="n5"'+(wLv==='n5'?' class="on"':'')+'>JLPT N5 · '+WD.n5.length+'</button><button data-a="lv" data-v="n4"'+(wLv==='n4'?' class="on"':'')+'>JLPT N4 · '+WD.n4.length+'</button></div>';
    h+='<p class="dk-hint">'+esc(T('wnote'))+(lang==='pt'||lang==='ar'?' '+esc(T('wnote2')):'')+'</p>';
    h+='<div class="w-tools"><input id="w-q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="'+esc(T('wfilter'))+'" value="'+esc(wQ)+'"><span class="dk-count" id="w-n"></span></div>';
    h+='<div class="td-row"><span><small>'+esc(T('target'))+': <b>'+esc(d.name)+'</b></small></span><button class="tg" data-a="alldeck"'+(has?' disabled':'')+'>'+esc(has?'✓ '+T('indeck'):'＋ '+T('wadd'))+'</button></div>';
    h+='<div id="w-list" class="w-list"></div>';
    wB.innerHTML=h; wList();
  }
  function openWords(q){closeAll(); if(typeof q==='string'){wQ=q;} wordsRender(); wP.hidden=false; b.classList.add('ov-open'); navSync();}
  document.getElementById('t-words').addEventListener('click',function(){openWords();});
  wP.addEventListener('click',function(e){
    var t=e.target.closest('[data-a]'); if(!t) return; var a=t.getAttribute('data-a'), x=wRows[+t.getAttribute('data-n')];
    if(a==='close'){closeAll(); navSync(); return;}
    if(a==='lv'){wLv=t.getAttribute('data-v'); wP.scrollTop=0; wordsRender(); return;}
    if(a==='say'&&x){play(x.e[1],x.e[1]); return;}
    if(a==='add'&&x){var d=curDeck(), k=ckey(x.r), i=-1; d.cards.forEach(function(c,n){if(ckey(c)===k) i=n});
      if(i>=0){d.cards.splice(i,1); note(T('removed')+' — '+d.name);} else {d.cards.push(pcard(x.r)); note(T('added')+' — '+d.name);}
      dSave(); t.classList.toggle('on',i<0); t.textContent=i<0?'✓':'＋'; return;}
    if(a==='alldeck'){addPreset('W:'+wLv); wordsRender(); return;}
  });
  wP.addEventListener('input',function(e){if(e.target.id==='w-q'){wQ=e.target.value; wList();}});
  // ---- language switching ----
  var lSel=document.getElementById('lang'), io=null, links={};
  LANGS.forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=UI[k].name;lSel.appendChild(o);});
  function setLang(l){
    if(!UI[l]) l='en';
    lang=l; lSel.value=l;
    root.setAttribute('lang',l); root.setAttribute('dir',l==='ar'?'rtl':'ltr');
    var anchor=null, tops=document.querySelectorAll('#content section.lesson');
    for(var i=0;i<tops.length;i++){ if(tops[i].getBoundingClientRect().bottom>80){anchor=tops[i].id;break;} }
    var t=document.getElementById('tpl-'+l).content;
    document.getElementById('content').innerHTML=t.querySelector('.t-body').innerHTML;
    document.getElementById('side-toc').innerHTML=t.querySelector('.t-toc').innerHTML;
    document.getElementById('m-toc').innerHTML=t.querySelector('.t-toc').innerHTML;
    var gib='<button type="button" class="tg gibtn">'+esc(T('gindex'))+' ›</button>';
    document.getElementById('lesbody').innerHTML=gib+t.querySelector('.t-toc').innerHTML;
    document.getElementById('side-toc').insertAdjacentHTML('afterbegin',gib);
    applyPage();
    imSync(); applyLabels();
    deckSync(); if(!dP.hidden) dRender();
    kMap(); lessonMarks(); fBtn.setAttribute('aria-pressed',b.classList.contains('nofuri')?'false':'true'); fBtn.textContent=T(b.classList.contains('nofuri')?'off':'on'); if(!tP.hidden) tRender(); if(!gP.hidden) gRender(); if(!wP.hidden) wordsRender(); sIdx=null; if(!sP.hidden) sRun(); navSync();
    if(!document.getElementById('keymsg').textContent) kmsg(T('keymsg'));
    if(!HOSTED) document.title=T('h1')+' — JLPT N5–N4';
    if(HOSTED){try{localStorage.setItem('lang',l)}catch(e){}}
    var keep=vSel.value; loadVoices(); if(keep) vSel.value=keep;
    links={}; document.querySelectorAll('#side-toc a').forEach(function(a){links[a.getAttribute('href').slice(1)]=a});
    if('IntersectionObserver' in window){
      if(io) io.disconnect();
      io=new IntersectionObserver(function(es){es.forEach(function(en){
        if(en.isIntersecting&&links[en.target.id]){
          Object.keys(links).forEach(function(k){links[k].classList.remove('on')});
          links[en.target.id].classList.add('on');
          if(!paged&&en.target.classList.contains('lesson')) setLes(en.target.id);
          links[en.target.id].scrollIntoView({block:'nearest'});
        }});},{rootMargin:'-20% 0px -70% 0px'});
      document.querySelectorAll('section.lesson,header.part').forEach(function(s){io.observe(s)});
    }
    if(anchor&&!paged){var el=document.getElementById(anchor); if(el) el.scrollIntoView();}
  }
  lSel.addEventListener('change',function(){setLang(lSel.value)});
  document.getElementById('m-toc').addEventListener('click',function(e){if(e.target.closest('a')) e.target.closest('details').open=false;});
  var hl=/lang=([a-z]{2})/.exec(location.hash), nav=(navigator.language||'en').slice(0,2).toLowerCase();
  var remembered=null; if(HOSTED){try{remembered=localStorage.getItem('lang')}catch(e){}}
  setLang((hl&&hl[1])||remembered||root.getAttribute('data-lang')||(UI[nav]?nav:'en'));
  if(paged){try{history.scrollRestoration='manual'}catch(e){} toTop();}
  if(HOSTED&&!h0&&((DK.list||[]).some(function(d){return d.cards.length})||(DK.done&&Object.keys(DK.done).length))) openToday();
  if(!paged&&curLes){var e0=document.getElementById(curLes); if(e0&&e0!==document.querySelector('#content section.lesson')) e0.scrollIntoView();}
})();
</script>
